apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: yaaabk-9341656d
  labels:
    app.kubernetes.io/name: todo-app
    yaaabk.io/project-id: '9341656d-b8c9-48ac-9e61-fafc675c7997'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # The deploy Job rewrites this to the merged commit SHA. Keep the
          # repository/tag here pullable so a manual apply still works.
          image: ghcr.io/yaaabk/todo-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: todo-app-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
